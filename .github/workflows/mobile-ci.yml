name: storm-path-mobile-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      eas_platform:
        description: "Optional EAS production build platform"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - ios
          - android
          - all

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Require compile tree
        run: |
          set -euo pipefail
          test -f package.json
          test -f tsconfig.json
          test -f App.tsx
          test -f index.ts
          test -f src/core/spTypes.ts
          test -f src/core/spStates.ts
          test -f src/core/spSources.ts
          test -f src/core/spConfidence.ts
          test -f src/core/spAlerts.ts
          test -f src/core/spRecompute.ts
          test -f src/core/spScreens.ts
          test -f src/core/spStartup.ts
          test -f src/core/spGoldenChecks.ts
          test -f src/core/spPersistence.ts
          test -f src/diagnostics/spHardwareLog.ts
          test -f src/location/spLocation.ts
          test -f src/net/spNWS.ts
          test -f src/net/spRadar.ts
          test -f src/state/StormPathStore.tsx
          test -f src/navigation/RootNavigator.tsx
          test -f src/screens/DriverScreen.tsx
          test -f src/screens/MapScreen.tsx
          test -f src/screens/WeatherScreen.tsx
          test -f src/screens/SettingsScreen.tsx
          echo "compile tree present"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "package-lock.json missing; using npm install"
            npm install --no-audit --no-fund
          fi
      - run: npx tsc --noEmit --pretty false
      - name: Isolation guard
        run: |
          test ! -f StormpathV1_3_5.html
          test ! -f index.html
          echo "storm-path web artifacts absent from mobile tree"

  eas_production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.eas_platform != 'none'
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - run: npm install --no-save eas-cli
      - name: EAS production build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is required for packaging"
            exit 1
          fi
          PLATFORM="${{ github.event.inputs.eas_platform }}"
          if [ "$PLATFORM" = "all" ]; then
            npx eas-cli build --platform all --profile production --non-interactive --no-wait
          else
            npx eas-cli build --platform "$PLATFORM" --profile production --non-interactive --no-wait
          fi
