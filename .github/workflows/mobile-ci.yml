name: storm-path-mobile-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      eas_platform:
        description: "Optional EAS production build platform"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - ios
          - android
          - all

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require engine tree
        run: |
          set -euo pipefail
          test -f src/core/spTypes.ts
          test -f src/core/vectorScore.ts
          test -f scripts/run-golden.ts
          test -f scripts/run-vector-score.ts
          test -f tsconfig.golden.json
          test -f tsconfig.vector.json
          test -f docs/index.html
          test ! -f StormpathV1_3_5.html
          test ! -f index.html
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install TypeScript only
        run: npm install --no-audit --no-fund --no-package-lock typescript@6.0.3
      - name: Golden invariants
        run: npm run test:golden
      - name: Vector score
        run: npm run test:vector
      - name: Upload vector score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-score
          path: vector-score.txt

  typecheck:
    runs-on: ubuntu-latest
    needs: engine
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require compile tree
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f tsconfig.json
          test -f App.tsx
          test -f assets/icon.png
          test -f src/screens/DriverScreen.tsx
          test -f src/ui/SearchSheet.tsx
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm ci --ignore-scripts --include=dev --no-audit --no-fund --registry https://registry.npmjs.org/
      - name: Typecheck
        run: |
          set -euo pipefail
          test -f node_modules/typescript/bin/tsc
          npm run typecheck -- --pretty false

  eas_production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.eas_platform != 'none'
    needs: [engine, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm ci --ignore-scripts --include=dev --no-audit --no-fund --registry https://registry.npmjs.org/
      - run: npm install --no-save eas-cli --registry https://registry.npmjs.org/
      - name: EAS production build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is required for packaging"
            exit 1
          fi
          PLATFORM="${{ github.event.inputs.eas_platform }}"
          if [ "$PLATFORM" = "all" ]; then
            npx eas-cli build --platform all --profile production --non-interactive --no-wait
          else
            npx eas-cli build --platform "$PLATFORM" --profile production --non-interactive --no-wait
          fi
